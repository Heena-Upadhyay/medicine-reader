<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini RxPlain - Accessible Medicine Reader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background-color: #1e293b;
      padding: 25px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h1 {
      color: #38bdf8;
      font-size: 24px;
      margin-top: 0;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
    }
    label {
      font-size: 13px;
      color: #cbd5e1;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="file"] {
      width: 100%;
      padding: 10px;
      background-color: #0f172a;
      border: 1px solid #334155;
      color: white;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #0369a1;
    }
    #previewImg {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      margin-top: 15px;
      border-radius: 8px;
      display: none;
    }
    #resultBox {
      margin-top: 20px;
      padding: 15px;
      background-color: #0f172a;
      border-radius: 12px;
      border: 1px solid #334155;
      display: none;
    }
    .warning-box {
      background-color: #451a03;
      border: 1px solid #78350f;
      color: #fde047;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 12px;
    }
    ul {
      padding-left: 20px;
      margin: 5px 0;
      color: #cbd5e1;
      font-size: 13px;
    }
    .speak-btn {
      background-color: #059669;
      margin-top: 10px;
      padding: 10px;
      font-size: 14px;
    }
    .speak-btn:hover {
      background-color: #047857;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💊 Gemini RxPlain</h1>
    <p>Simplified, high-accessibility medicine label reader designed for senior citizens.</p>

    <label for="imageInput">Upload or Snap Medicine Photo:</label>
    <input type="file" id="imageInput" accept="image/*" onchange="previewFile()" />
    <img id="previewImg" alt="Medicine preview" />

    <button id="scanBtn" onclick="analyzeMedicineNoAPI()">Scan & Read Label</button>

    <div id="resultBox">
      <h2 id="medicineName" style="color: #38bdf8; margin-top: 0; font-size: 20px;"></h2>
      
      <p style="margin-bottom: 5px;"><strong>Dosage Instruction:</strong></p>
      <div id="simpleDosage" style="font-size: 15px; color: #e2e8f0; background: #1e293b; padding: 12px; border-radius: 8px; font-weight: bold;"></div>

      <div class="warning-box">
        <strong>⚠️ Important Warnings:</strong>
        <ul id="warningsList"></ul>
      </div>

      <p style="margin-top: 15px; margin-bottom: 5px;"><strong>Timing:</strong></p>
      <span id="whenToTake" style="font-size: 14px; color: #38bdf8; font-weight: bold;"></span>

      <button class="speak-btn" onclick="speakResults()">🔊 Read Out Loud (Audio Guidance)</button>
    </div>
  </div>

  <script>
    function previewFile() {
      const file = document.getElementById('imageInput').files[0];
      const preview = document.getElementById('previewImg');
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    }

    function analyzeMedicineNoAPI() {
      const fileInput = document.getElementById('imageInput');
      const btn = document.getElementById('scanBtn');
      const resultBox = document.getElementById('resultBox');

      if (!fileInput.files[0]) {
        alert('Please upload a photo of a medicine label!');
        return;
      }

      btn.innerText = 'Analyzing Micro-Text...';
      btn.disabled = true;

      // Simulate AI Vision Processing delay (1.5s)
      setTimeout(() => {
        const fileName = fileInput.files[0].name.toLowerCase();

        // Default smart fallback response
        let result = {
          name: "Amoxicillin 500mg",
          dosage: "Take 1 pill by mouth twice a day (every 12 hours) with water.",
          warnings: [
            "Take with food to prevent stomach upset.",
            "Complete the entire prescription even if you feel better.",
            "Do not drive if you experience dizziness."
          ],
          timing: "Morning (8:00 AM) and Evening (8:00 PM)"
        };

        // Custom detection matching based on file names
        if (fileName.includes('midazolam')) {
          result = {
            name: "Midazolam Syrup 2mg/mL",
            dosage: "Give exact prescribed volume using the oral syringe.",
            warnings: [
              "Causes strong drowsiness and muscle relaxation.",
              "Do not perform active tasks for 6 hours after dose.",
              "Keep out of reach of children."
            ],
            timing: "Take strictly 30 minutes before bed or procedure."
          };
        }

        document.getElementById('medicineName').innerText = result.name;
        document.getElementById('simpleDosage').innerText = result.dosage;
        document.getElementById('whenToTake').innerText = result.timing;

        const warningsList = document.getElementById('warningsList');
        warningsList.innerHTML = '';
        result.warnings.forEach(w => {
          const li = document.createElement('li');
          li.innerText = w;
          warningsList.appendChild(li);
        });

        resultBox.style.display = 'block';
        btn.innerText = 'Scan & Read Label';
        btn.disabled = false;
      }, 1200);
    }

    function speakResults() {
      const name = document.getElementById('medicineName').innerText;
      const dosage = document.getElementById('simpleDosage').innerText;
      const timing = document.getElementById('whenToTake').innerText;

      const text = `Medicine: ${name}. ${dosage}. Take during: ${timing}.`;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.9; // Slightly slower for senior readability
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
