<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini RxPlain - Medicine Label Reader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background-color: #1e293b;
      padding: 25px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h1 {
      color: #38bdf8;
      font-size: 22px;
      margin-top: 0;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
    }
    label {
      font-size: 12px;
      color: #cbd5e1;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      background-color: #0f172a;
      border: 1px solid #334155;
      color: white;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #0369a1;
    }
    #resultBox {
      margin-top: 20px;
      padding: 15px;
      background-color: #0f172a;
      border-radius: 12px;
      border: 1px solid #334155;
      display: none;
    }
    .warning-box {
      background-color: #451a03;
      border: 1px solid #78350f;
      color: #fde047;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 10px;
    }
    ul {
      padding-left: 20px;
      margin: 5px 0;
      color: #cbd5e1;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💊 Gemini RxPlain</h1>
    <p>Snap a photo of any medicine bottle or box label to get easy-to-read dosage instructions and safety warnings.</p>

    <label for="apiKey">Paste Your Free Gemini API Key:</label>
    <input type="text" id="apiKey" placeholder="Paste key here..." />

    <label for="imageInput">Upload Medicine Label Photo:</label>
    <input type="file" id="imageInput" accept="image/*" />

    <button id="scanBtn" onclick="readMedicineLabel()">Scan & Read Label</button>

    <div id="resultBox">
      <h2 id="medicineName" style="color: #38bdf8; margin-top: 0; font-size: 18px;">Medicine Name</h2>
      
      <p style="margin-bottom: 5px;"><strong>How Much to Take:</strong></p>
      <div id="simpleDosage" style="font-size: 14px; color: #e2e8f0; background: #1e293b; padding: 10px; border-radius: 8px;"></div>

      <div class="warning-box">
        <strong>⚠️ Important Warnings:</strong>
        <ul id="warningsList"></ul>
      </div>

      <p style="margin-top: 15px; margin-bottom: 5px;"><strong>Best Time to Take:</strong></p>
      <span id="whenToTake" style="font-size: 13px; color: #38bdf8;"></span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
