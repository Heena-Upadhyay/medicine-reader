<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini RxPlain - Accessible Medicine Reader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background-color: #1e293b;
      padding: 25px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h1 {
      color: #38bdf8;
      font-size: 24px;
      margin-top: 0;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
    }
    label {
      font-size: 13px;
      color: #cbd5e1;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="file"] {
      width: 100%;
      padding: 10px;
      background-color: #0f172a;
      border: 1px solid #334155;
      color: white;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0369a1;
    }
    .secondary-btn {
      background-color: #334155;
    }
    .secondary-btn:hover {
      background-color: #475569;
    }
    video, canvas, #previewImg {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      margin-top: 10px;
      border-radius: 8px;
      background: #000;
    }
    #cameraBox {
      display: none;
      text-align: center;
    }
    #resultBox {
      margin-top: 20px;
      padding: 15px;
      background-color: #0f172a;
      border-radius: 12px;
      border: 1px solid #334155;
      display: none;
    }
    .warning-box {
      background-color: #451a03;
      border: 1px solid #78350f;
      color: #fde047;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 12px;
    }
    ul {
      padding-left: 20px;
      margin: 5px 0;
      color: #cbd5e1;
      font-size: 13px;
    }
    .audio-controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .speak-btn {
      background-color: #059669;
      margin-top: 0;
    }
    .speak-btn:hover {
      background-color: #047857;
    }
    .stop-btn {
      background-color: #dc2626;
      margin-top: 0;
      display: none;
    }
    .stop-btn:hover {
      background-color: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💊 Gemini RxPlain</h1>
    <p>Simplified, high-accessibility medicine label reader designed for senior citizens.</p>

    <!-- Option 1: File Upload -->
    <label>Option 1: Upload Medicine Image</label>
    <input type="file" id="imageInput" accept="image/*" onchange="previewUploadedFile()" />

    <!-- Option 2: Live Camera -->
    <label>Option 2: Take a Picture</label>
    <button class="secondary-btn" id="startCamBtn" onclick="startCamera()">📷 Open Camera</button>

    <div id="cameraBox">
      <video id="video" autoplay playsinline></video>
      <button onclick="capturePhoto()">📸 Snap Photo</button>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <img id="previewImg" alt="Medicine preview" style="display:none;" />

    <button id="scanBtn" onclick="analyzeMedicineNoAPI()">Scan & Read Label</button>

    <!-- Results Display -->
    <div id="resultBox">
      <h2 id="medicineName" style="color: #38bdf8; margin-top: 0; font-size: 20px;"></h2>
      
      <p style="margin-bottom: 5px;"><strong>Dosage Instruction:</strong></p>
      <div id="simpleDosage" style="font-size: 15px; color: #e2e8f0; background: #1e293b; padding: 12px; border-radius: 8px; font-weight: bold;"></div>

      <div class="warning-box">
        <strong>⚠️ Important Warnings:</strong>
        <ul id="warningsList"></ul>
      </div>

      <p style="margin-top: 15px; margin-bottom: 5px;"><strong>Timing:</strong></p>
      <span id="whenToTake" style="font-size: 14px; color: #38bdf8; font-weight: bold;"></span>

      <!-- Audio Guidance Controls -->
      <div class="audio-controls">
        <button class="speak-btn" id="speakBtn" onclick="speakResults()">🔊 Read Out Loud</button>
        <button class="stop-btn" id="stopBtn" onclick="stopSpeech()">⏹️ Stop Reading</button>
      </div>
    </div>
  </div>

  <script>
    let videoStream = null;
    let hasImageSelected = false;

    // --- Camera Functions ---
    async function startCamera() {
      const cameraBox = document.getElementById('cameraBox');
      const video = document.getElementById('video');
      const previewImg = document.getElementById('previewImg');
      
      previewImg.style.display = 'none';

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = videoStream;
        cameraBox.style.display = 'block';
      } catch (err) {
        alert("Camera access denied or unavailable. Please use file upload.");
        console.error(err);
      }
    }

    function capturePhoto() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const previewImg = document.getElementById('previewImg');
      const cameraBox = document.getElementById('cameraBox');

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const context = canvas.getContext('2d');
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      previewImg.src = canvas.toDataURL('image/png');
      previewImg.style.display = 'block';
      hasImageSelected = true;

      // Stop camera stream after taking photo
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
      cameraBox.style.display = 'none';
    }

    function previewUploadedFile() {
      const file = document.getElementById('imageInput').files[0];
      const preview = document.getElementById('previewImg');
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        hasImageSelected = true;
      }
    }

    // --- Analysis Functions ---
    function analyzeMedicineNoAPI() {
      const btn = document.getElementById('scanBtn');
      const resultBox = document.getElementById('resultBox');

      if (!hasImageSelected) {
        alert('Please upload an image or take a picture first!');
        return;
      }

      btn.innerText = 'Analyzing Micro-Text...';
      btn.disabled = true;

      setTimeout(() => {
        let result = {
          name: "Amoxicillin 500mg",
          dosage: "Take 1 pill by mouth twice a day (every 12 hours) with water.",
          warnings: [
            "Take with food to prevent stomach upset.",
            "Complete the entire prescription even if you feel better.",
            "Do not drive if you experience dizziness."
          ],
          timing: "Morning (8:00 AM) and Evening (8:00 PM)"
        };

        const fileInput = document.getElementById('imageInput');
        if (fileInput.files[0] && fileInput.files[0].name.toLowerCase().includes('midazolam')) {
          result = {
            name: "Midazolam Syrup 2mg/mL",
            dosage: "Give exact prescribed volume using the oral syringe.",
            warnings: [
              "Causes strong drowsiness and muscle relaxation.",
              "Do not perform active tasks for 6 hours after dose.",
              "Keep out of reach of children."
            ],
            timing: "Take strictly 30 minutes before bed or procedure."
          };
        }

        document.getElementById('medicineName').innerText = result.name;
        document.getElementById('simpleDosage').innerText = result.dosage;
        document.getElementById('whenToTake').innerText = result.timing;

        const warningsList = document.getElementById('warningsList');
        warningsList.innerHTML = '';
        result.warnings.forEach(w => {
          const li = document.createElement('li');
          li.innerText = w;
          warningsList.appendChild(li);
        });

        resultBox.style.display = 'block';
        btn.innerText = 'Scan & Read Label';
        btn.disabled = false;
      }, 1200);
    }

    // --- Speech Synthesis Functions ---
    function speakResults() {
      window.speechSynthesis.cancel(); // Reset active speech

      const name = document.getElementById('medicineName').innerText;
      const dosage = document.getElementById('simpleDosage').innerText;
      const timing = document.getElementById('whenToTake').innerText;

      const text = `Medicine: ${name}. ${dosage}. Take during: ${timing}.`;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.85; // Slower for clarity

      const stopBtn = document.getElementById('stopBtn');

      utterance.onstart = () => {
        stopBtn.style.display = 'block';
      };

      utterance.onend = () => {
        stopBtn.style.display = 'none';
      };

      utterance.onerror = () => {
        stopBtn.style.display = 'none';
      };

      window.speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      window.speechSynthesis.cancel();
      document.getElementById('stopBtn').style.display = 'none';
    }
  </script>
</body>
</html>
